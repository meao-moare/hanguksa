name: 고친 내용 굳히기
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths: ['tools/bake.py','.github/workflows/bake.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: bake, cancel-in-progress: false}
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/bake.py
      - run: |
          git config user.name "hanguksa"
          git config user.email "hanguksa@users.noreply.github.com"
          git add mine.json baked.js tools/bake_log.txt
          git commit -m "고친 내용 굳히기 (자동)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
